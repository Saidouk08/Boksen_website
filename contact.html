  <main class="page-content">
    <section class="contact-section">
      <h2>Geef je mening</h2>
      <p>Vul het formulier in en laat weten wat je van mijn website vindt.</p>

      <form id="meningFormulier" class="contact-form" action="https://formsubmit.co/saidoukane6@gmail.com" method="POST"
        enctype="multipart/form-data">

        <!-- BEVEILIGING & INSTELLINGEN -->
        <input type="hidden" name="_subject" value="Nieuwe mening via mijn boksen website">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="bedankt.html">
        <input type="hidden" name="_autoresponse" value="Bedankt voor je bericht!">

        <!-- SPAMBEVEILIGING -->
        <input type="text" name="_honey" style="display:none">

        <!-- FORMULIER -->

        <label for="voornaam">Voornaam *</label>
        <input type="text" id="voornaam" name="voornaam" placeholder="Je voornaam" required>

        <label for="achternaam">Achternaam *</label>
        <input type="text" id="achternaam" name="achternaam" placeholder="Je achternaam" required>

        <label for="email">E-mailadres *</label>
        <input type="email" id="email" name="email" placeholder="naam@example.com" required>

        <label for="leeftijd">Leeftijd</label>
        <input type="number" id="leeftijd" name="leeftijd" min="10" max="99">

        <fieldset>
          <legend>Wat vind je van boksen?</legend>
          <label><input type="radio" name="mening_boksen" value="interessant"> Interessant</label>
          <label><input type="radio" name="mening_boksen" value="neutraal"> Neutraal</label>
          <label><input type="radio" name="mening_boksen" value="niet_interessant"> Niet interessant</label>
        </fieldset>

        <fieldset>
          <legend>Welke onderdelen vond je goed?</legend>
          <label><input type="checkbox" name="goed" value="layout"> Lay-out</label>
          <label><input type="checkbox" name="goed" value="foto"> Foto’s</label>
          <label><input type="checkbox" name="goed" value="informatie"> Informatie</label>
        </fieldset>

        <label for="score">Score voor de website</label>
        <select id="score" name="score">
          <option value="">Kies een score</option>
          <option value="5">5 - Zeer goed</option>
          <option value="4">4 - Goed</option>
          <option value="3">3 - Oké</option>
          <option value="2">2 - Minder goed</option>
          <option value="1">1 - Slecht</option>
        </select>

        <label for="kleur">Klik op de balk om een kleur te kiezen</label>
        <input type="color" id="kleur" name="favoriete_kleur" value="#b30000">

        <label for="datum">Datum van bezoek</label>
        <input type="date" id="datum" name="datum_bezoek">

        <label for="bericht">Bericht of mening *</label>
        <textarea id="bericht" name="bericht" rows="5" placeholder="Schrijf hier je mening..." required></textarea>

        <label for="bestand">Upload eventueel een afbeelding</label>
        <input type="file" id="bestand" name="bestand" accept="image/*">

        <label class="privacy">
          <input type="checkbox" name="akkoord" required>
          Ik ga akkoord dat mijn mening verzonden wordt.
        </label>

        <div class="form-buttons">
          <button type="submit">Verzenden</button>
          <button type="reset">Wissen</button>
        </div>
      </form>
    </section>
  </main>
